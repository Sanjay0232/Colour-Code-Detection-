<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Detector - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-primary">Color</span>
                <span>Detector</span>
            </a>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Sign in to your account to continue</p>
            </div>

            <div class="auth-form-container">
                <div id="error-message" class="error-message hidden"></div>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="form-group">
                        <div class="password-label">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        <div class="password-input">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" id="toggle-password" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-button" class="btn btn-primary btn-block">Sign in</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html" class="text-primary">Sign up</a></p>
                </div>
            </div>

            <div class="demo-credentials">
                <p>Demo credentials:</p>
                <p>Email: demo@example.com</p>
                <p>Password: password</p>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
